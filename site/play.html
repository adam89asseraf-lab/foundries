<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Found rizz — Play</title>
<meta name="description" content="Found rizz font games: Casting Call, Type Personality Quiz, Font Bracket and Tier List.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&family=Rethink+Sans:wght@500;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ededea; --tile:#f7f7f5; --ink:#121214; --muted:#6b6b72; --line:#cfcfcb; --grey:#dcdcd8; --accent:#2b36e8; --good:#00a316;
  --stat:"Rethink Sans","Instrument Sans",Arial,sans-serif; --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif; --mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#0e0e11; --tile:#16161a; --ink:#ececee; --muted:#8e8e98; --line:#2a2a31; --grey:#2a2a31; --accent:#8790ff; --good:#3ddc55; color-scheme:dark; }
}
:root[data-theme="dark"]{ --paper:#0e0e11; --tile:#16161a; --ink:#ececee; --muted:#8e8e98; --line:#2a2a31; --grey:#2a2a31; --accent:#8790ff; --good:#3ddc55; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px}
/* header */
.top{display:flex;align-items:center;gap:20px;padding:22px 0 18px;border-bottom:1px solid var(--ink)}
.brand{font:700 30px/1 var(--stat);letter-spacing:-.03em;text-decoration:none}
.games{display:flex;border:1px solid var(--line);margin-left:auto}
.games a{padding:9px 16px;text-decoration:none;font:500 14px/1 var(--body);white-space:nowrap}
.games a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.back{font:400 14px/1 var(--body);white-space:nowrap}
.proto{margin:14px 0 0;font:500 11px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
main{padding:28px 0 80px;min-height:60vh}
/* bits */
.eyebrow{font:500 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0}
h1.big{font:700 clamp(40px,6vw,72px)/1 var(--stat);letter-spacing:-.04em;margin:8px 0 12px}
h2.role{font:700 clamp(28px,4vw,48px)/1.05 var(--stat);letter-spacing:-.03em;margin:6px 0 24px;text-wrap:balance}
.lede{font-size:18px;color:var(--muted);max-width:560px;margin:0 0 24px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{height:44px;padding:0 20px;border:1px solid var(--ink);background:transparent;cursor:pointer;font:500 15px/1 var(--body);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:not(:disabled):hover{outline:2px solid var(--ink);outline-offset:1px}
.link{border:0;background:none;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tag{display:inline-flex;align-items:center;font:500 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.02em;border:1px solid var(--line);padding:5px 10px;white-space:nowrap}
.tag.ink{border-color:var(--ink)}
.tag.fill{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.bar .grow{flex:1}
.mono{font:500 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.04em}
.spec{display:block;aspect-ratio:5/2;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0}
.spec img{width:100%;height:100%;object-fit:cover;display:block}
.fname{font:700 16px/1.2 var(--stat);margin-top:8px}
.fby{font:400 11px/1.3 var(--mono);text-transform:uppercase;color:var(--muted)}
/* choice cards */
.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.choices.two{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.choice{all:unset;cursor:pointer;display:grid;gap:4px;align-content:start;position:relative}
.choice:focus-visible .spec{outline:3px solid var(--accent);outline-offset:2px}
.choice:hover .spec{border-color:var(--ink)}
.choice.best .spec{border:2px solid var(--ink)}
.choice.worst .spec{opacity:.45}
.choice.worst .fname{text-decoration:line-through;color:var(--muted)}
.choice .badge{position:absolute;top:10px;left:10px}
.hint{color:var(--muted);margin:20px 0}
/* meters */
.meter{display:grid;gap:4px;margin-top:6px}
.meter .lab{display:flex;justify-content:space-between;font:500 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.meter .lab b{color:var(--ink);font-weight:500}
.track{height:8px;background:var(--grey);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.track.soft i{background:var(--muted)}
.score{font:700 64px/1 var(--stat);letter-spacing:-.03em;color:var(--accent)}
.points{display:flex;align-items:center;gap:20px;margin-bottom:24px}
/* lobby tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:12px 0 24px}
.tile{all:unset;cursor:pointer;background:var(--tile);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:10px}
.tile:hover,.tile:focus-visible{border-color:var(--ink)}
.tile .t{display:flex;align-items:baseline;gap:8px;font:700 18px/1 var(--stat)}
.stats{display:flex;gap:24px;flex-wrap:wrap}
/* wrap / lists */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:48px;align-items:start}
.panel{background:var(--tile);border:1px solid var(--line);border-radius:8px;padding:20px}
.list{display:grid;gap:12px;margin-top:12px}
.li{display:grid;grid-template-columns:28px 120px minmax(0,1fr);gap:14px;align-items:center}
.li .n{font:700 20px/1 var(--stat)}
.li .spec{border-radius:4px}
.li small{display:block;color:var(--muted)}
/* quiz */
.progress{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-bottom:20px}
.progress i{height:6px;background:var(--grey)}
.progress i.on{background:var(--ink)}
.axis{display:grid;gap:6px;margin:10px 0}
.axis .lab{display:flex;justify-content:space-between;font:500 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.03em}
.axis .rail{height:4px;background:var(--grey);position:relative}
.axis .rail i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);transition:left .6s}
.cardpreview{width:100%;max-width:360px;border:1px solid var(--line);display:block}
/* bracket */
.bracket{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr)) minmax(150px,1fr);gap:20px;overflow-x:auto;padding-bottom:8px}
.bcol{display:flex;flex-direction:column;min-height:480px}
.champ h3{margin:0 0 6px}
.bcol .slots{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:6px}
.bcol h3{margin:0 0 6px}
.slot{display:flex;align-items:center;justify-content:space-between;gap:6px;height:28px;padding:0 8px;background:var(--tile);border:1px solid var(--line);font:400 12.5px/1 var(--body);white-space:nowrap;overflow:hidden}
.slot.win{font-weight:600;background:#fff;color:#121214}
.slot.lose{opacity:.5}
.slot.live{border:2px solid var(--ink)}
.slot.empty{color:var(--muted);background:transparent}
.slot em{font:500 10px/1 var(--mono);font-style:normal;color:var(--muted)}
.champ{display:flex;flex-direction:column}
.champ .slots{flex:1;display:flex;flex-direction:column;justify-content:center}
.champbox{background:var(--ink);color:var(--paper);border-radius:6px;padding:16px;display:grid;gap:8px;text-align:center;font:700 18px/1.2 var(--stat)}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:20px;align-items:center}
.vs .v{font:700 28px/1 var(--stat);color:var(--muted)}
.themes{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 20px}
.themes button{all:unset;cursor:pointer;font:500 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.02em;border:1px solid var(--line);padding:7px 10px}
.themes button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.empty{color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.toast.show{opacity:1}
/* tier list */
.tierboard{display:grid;gap:6px;margin:8px 0 16px}
.trow{display:grid;grid-template-columns:72px minmax(0,1fr);min-height:104px;border:1px solid var(--line);background:var(--tile)}
.trow.drop,.tpool.drop{outline:2px dashed var(--ink);outline-offset:-4px}
.trow.armed{cursor:pointer}
.trow.armed:hover{border-color:var(--ink)}
.tlab{all:unset;display:grid;place-items:center;font:700 34px/1 var(--stat);color:#121214;cursor:default}
.trow.armed .tlab{cursor:pointer}
.tlab:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.t5 .tlab{background:#ff7f7f}.t4 .tlab{background:#ffbf7f}.t3 .tlab{background:#ffdf7f}.t2 .tlab{background:#bfff7f}.t1 .tlab{background:#7fbfff}
.tcards{display:flex;flex-wrap:wrap;gap:8px;padding:8px;align-content:flex-start}
.tpool{border:1px solid var(--line);padding:8px;display:flex;flex-wrap:wrap;gap:8px;min-height:104px}
.tcard{all:unset;cursor:grab;width:176px;display:grid;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px}
.tcard .spec{border-radius:4px}
.tcard .tn{font:600 12px/1.2 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px 2px}
.tcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.tcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tcard.dragging{opacity:.4}
.tcmp{display:grid;grid-template-columns:28px 120px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tchip{display:inline-grid;place-items:center;width:30px;height:30px;font:700 16px/1 var(--stat);color:#121214}
.tchip.t5{background:#ff7f7f}.tchip.t4{background:#ffbf7f}.tchip.t3{background:#ffdf7f}.tchip.t2{background:#bfff7f}.tchip.t1{background:#7fbfff}.tchip.t0{background:var(--grey);color:var(--muted)}
.fsel{height:44px;border:1px solid var(--ink);background:transparent;padding:0 12px;font:500 15px/1 var(--body);min-width:220px}
@media (max-width:640px){.trow{grid-template-columns:48px minmax(0,1fr);min-height:84px}.tlab{font-size:24px}.tcard{width:calc(50% - 4px)}.tcmp{grid-template-columns:24px 84px minmax(0,1fr) auto auto;gap:8px}.fsel{min-width:0;width:100%}}
@media (max-width:900px){.choices{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr;gap:32px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.wrap{padding:0 16px}.top{flex-wrap:wrap;gap:12px}.games{margin-left:0;order:3;width:100%}.games a{flex:1;text-align:center;padding:10px 6px;font-size:13px}.back{margin-left:auto}
  .choices.two{grid-template-columns:1fr}.vs{grid-template-columns:1fr}.vs .v{text-align:center}.tiles{grid-template-columns:1fr}.score{font-size:48px}}
@media (prefers-reduced-motion:reduce){.track i,.axis .rail i{transition:none}}

/* ===== Figma v4: site header + Tier List (values from the frames' auto layout) ===== */
.wrap{max-width:1200px;padding:0 48px}
.top{padding:48px 0 0;border-bottom:0;gap:16px}
.brand{font:700 30px/1.3 var(--stat);letter-spacing:-.03em}
.sitenav{display:flex;margin-left:auto;border:1px solid var(--line)}
.sitenav a{padding:9px 16px;text-decoration:none;font:500 14px/17px var(--body);white-space:nowrap}
.sitenav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.sitenav a:not([aria-current]):hover{background:var(--tile)}
.games{display:flex;gap:20px;margin:16px 0 0;border:0}
.games a{padding:0 0 4px;font:500 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-decoration:none;border-bottom:1px solid transparent}
.games a[aria-current="page"]{background:none;color:var(--ink);border-bottom-color:var(--ink)}
.games a:hover{color:var(--ink)}
main{padding:24px 0 80px}
.btn{height:46px;padding:0 20px;font:500 15px/1 var(--body)}
/* lobby */
.tlhead{display:grid;gap:0;max-width:560px;margin-bottom:40px}
.tlhead h1{font:700 64px/1.3 var(--stat);letter-spacing:0;margin:0}
.tlhead p{font:400 18px/1.22 var(--body);color:var(--muted);margin:0}
.fgridl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-left:1px solid var(--line);padding-top:14px;margin-bottom:24px}
.fcard2{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;padding:24px 32px 12px;background:var(--tile);border:1px solid var(--line);border-left:0;margin-top:-1px;position:relative}
.fcard2:hover{border-color:var(--ink);z-index:1;outline:1px solid var(--ink);outline-offset:-1px}
.fcard2:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;z-index:2}
.fc2head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;min-height:28px}
.fc2name{font:700 26px/1 "Inter Tight",var(--body);letter-spacing:-.02em;overflow-wrap:anywhere}
.fc2shot{margin-top:16px;aspect-ratio:16/10;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.fc2shot img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.fc2foot{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 0 16px}
.jtags{display:flex;flex-wrap:wrap;row-gap:6px}
.jtags span{font:500 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.02em;border:1px solid var(--line);padding:4px 10px 5px;height:21px;display:inline-flex;align-items:center;box-sizing:border-box}
.jtags span + span{margin-left:-1px}
.fc2more{font:400 14px/1.45 var(--body);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.heart{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;height:28px;color:var(--ink);position:relative;z-index:2}
.heart svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5}
.heart[aria-pressed="true"] svg{fill:var(--accent);stroke:var(--accent)}
.heart .vn{font:500 12px/1 var(--mono)}
.heart:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tlactions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.fsel{height:46px;border:1px solid var(--ink);padding:0 12px;font:500 15px/1 var(--body);min-width:241px;background:transparent;color:var(--ink)}
/* ranking */
.tlbar{display:flex;align-items:baseline;gap:16px;padding-top:8px;margin-bottom:10px}
.tlbar h2{font:700 clamp(32px,4.7vw,56px)/1.3 var(--stat);margin:0;letter-spacing:0;flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.tlbar .grow{display:none}
.tlbar .cnt,.tlbar .acts{flex:none}
.tlbar .cnt{font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:0}
.tlbar .acts{display:flex;gap:12px}
.tierboard{display:grid;gap:0;margin:0 0 10px}
.trow{grid-template-columns:64px minmax(0,1fr);min-height:98px;margin-top:-1px}
.trow:first-child{margin-top:0}
.tlab{font:700 30px/1.3 var(--stat)}
.tcards{gap:8px;padding:5px 6px;align-content:flex-start}
.tcard{width:271px;height:86px;padding:4px;border:0;border-radius:6px;background:transparent;display:block;box-sizing:border-box}
.tcard .spec{height:100%;aspect-ratio:auto;border-radius:6px}
.tcard .spec img{object-position:center}
.tcard[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.tcard:hover .spec{border-color:var(--ink)}
.tpoolhead{font:500 11px/1.3 var(--mono);text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.tpool{flex-wrap:nowrap;overflow-x:auto;gap:8px;padding:6px;min-height:0;scrollbar-width:thin}
.tpool .tcard{width:263px;height:74px;flex:none}
.tpool .empty{padding:24px 8px;font-size:14px}
/* result */
.tlres{display:grid;max-width:640px;margin-bottom:24px}
.tlres h1{font:700 56px/1.3 var(--stat);margin:0}
.tlres p{font:400 18px/1.22 var(--body);color:var(--muted);margin:0}
.panel.tvs{max-width:820px;padding:16px 24px 8px;border-radius:8px;margin-bottom:24px}
.tcmp{grid-template-columns:7px 120px minmax(0,1fr) 30px 30px;gap:14px;padding:8px 0}
.tcmp:last-child{border-bottom:0}
.tcmp .spec{width:120px;height:48px;aspect-ratio:auto;border-radius:4px}
.tcmp.thead{padding:0 0 0;border-bottom:0;grid-template-columns:minmax(0,1fr) 30px 30px}
.tcmp.thead span{font:500 11px/1.3 var(--mono);text-transform:uppercase;color:var(--muted);text-align:center}
.tcmp.thead span:first-child{text-align:left}
@media (max-width:640px){
  .wrap{padding:0 16px}.top{padding-top:20px}.brand{font-size:24px}.sitenav a{padding:8px 10px;font-size:13px}
  .games{gap:14px;overflow-x:auto}
  .tlhead h1{font-size:44px}.tlhead{margin-bottom:24px}
  .fgridl{grid-template-columns:1fr}.fcard2{padding:20px 20px 8px}
  .tlbar{flex-wrap:wrap}.tlbar h2{font-size:36px;flex-basis:100%}.tlbar .acts{flex:1 1 100%}.tlbar .acts .btn{flex:1 1 0;min-width:0;padding:0 10px;font-size:14px;justify-content:center}
  .trow{grid-template-columns:44px minmax(0,1fr);min-height:84px}.tlab{font-size:24px}
  .tcard{width:calc(50% - 4px);height:62px}.tpool .tcard{width:200px;height:62px}
  .tlres h1{font-size:36px}
  .tcmp{grid-template-columns:7px 84px minmax(0,1fr) 30px 30px;gap:8px}.tcmp .spec{width:84px;height:34px}
  .fsel{min-width:0;width:100%}
}
@media (min-width:641px) and (max-width:900px){.fgridl{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="./">Found rizz</a>
    <nav class="sitenav" aria-label="Sections"><a href="./#fonts">Fonts</a><a href="./#foundries">Foundries</a><a href="./#libraries">Libraries</a><a href="play.html#tiers" aria-current="page">Play</a></nav>
  </header>
  <nav class="games" aria-label="Games">
    <a href="#tiers" data-g="tiers">Tier List</a>
    <a href="#casting" data-g="casting">Casting Call</a>
    <a href="#quiz" data-g="quiz">Type Quiz</a>
    <a href="#bracket" data-g="bracket">Font Bracket</a>
  </nav>
  <p class="proto" id="proto" hidden>Prototype · your picks stay in this browser · crowd results are simulated until enough people play</p>
  <main id="app" aria-live="polite"><p class="empty">Loading fonts…</p></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const app = $("#app");
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200); };
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} } };
  const hash = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0; return h / 4294967295; };
  const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  /* =================== Tier List =================== */
  // Rank one foundry's fonts S–D. Tiers are saved anonymously (one per browser per font) and averaged into the
  // popularity score that orders the Fonts tab for everyone.
  const TIERS = [[5, "S"], [4, "A"], [3, "B"], [2, "C"], [1, "D"]];
  const TIER_MAX = 12;
  const TIER_SCORES = new Map(); // font id -> { n, total }
  let tl = null;
  const voterId = (() => { let v = null; try { v = localStorage.getItem("fdx-voter"); if (!v) { v = crypto.randomUUID(); localStorage.setItem("fdx-voter", v); } } catch (e) { v = v || crypto.randomUUID(); } return v; })();
  const myTiers = () => store.get("fdx-tiers", {}); // font id -> tier
  const crowdTier = id => { const s = TIER_SCORES.get(id); if (!s || !s.n) return 0; return Math.min(5, Math.max(1, Math.round(s.total / s.n))); };
  const letter = t => (TIERS.find(([v]) => v === t) || [0, "–"])[1];
  async function loadTierScores() {
    try {
      for (let from = 0; ; from += 1000) {
        const r = await fetch(VOTE_API.url + "/rest/v1/tier_scores?select=font_id,n,total", { headers: { apikey: VOTE_API.key, Authorization: "Bearer " + VOTE_API.key, Range: `${from}-${from + 999}` } });
        if (!r.ok) break;
        const rows = await r.json(); rows.forEach(x => TIER_SCORES.set(x.font_id, { n: x.n, total: x.total }));
        if (rows.length < 1000) break;
      }
    } catch (e) {}
  }
  const tierFoundries = () => {
    const m = new Map(); for (const f of TIER_FONTS) m.set(f.foundryId, (m.get(f.foundryId) || 0) + 1);
    return [...m].filter(([, n]) => n >= 3).map(([id, n]) => ({ id, n, name: MAKER.get(id) || id })).sort((a, b) => a.name.localeCompare(b.name));
  };
  // hearts on foundry cards: the same likes as the index ("foundry:<id>", one per browser)
  const myVotes = new Set(store.get("fdx-voted", []));
  function heartBtn(key, name) {
    const b = el("button", "heart"); b.type = "button"; b.setAttribute("aria-label", "Like " + name);
    b.innerHTML = '<span class="vn"></span><svg viewBox="0 0 20 20" aria-hidden="true"><path transform="translate(1.875 3.75)" d="M8.125 13.75S0 9.375 0 4.219A4.22 4.22 0 0 1 4.219 0C5.984 0 7.495.962 8.125 2.5 8.755.962 10.266 0 12.031 0A4.22 4.22 0 0 1 16.25 4.219C16.25 9.375 8.125 13.75 8.125 13.75Z"/></svg>';
    const paint = () => { b.setAttribute("aria-pressed", myVotes.has(key)); b.querySelector(".vn").textContent = VOTES.get(key) || ""; };
    b.onclick = async e => {
      e.stopPropagation(); const on = !myVotes.has(key);
      on ? myVotes.add(key) : myVotes.delete(key); VOTES.set(key, Math.max(0, (VOTES.get(key) || 0) + (on ? 1 : -1))); paint(); store.set("fdx-voted", [...myVotes]);
      try { const r = await fetch(VOTE_API.url + "/rest/v1/rpc/" + (on ? "vote" : "unvote"), { method: "POST", headers: { apikey: VOTE_API.key, Authorization: "Bearer " + VOTE_API.key, "Content-Type": "application/json" }, body: JSON.stringify({ p_font: key, p_voter: voterId }) }); if (!r.ok) throw 0; }
      catch (err) { on ? myVotes.delete(key) : myVotes.add(key); VOTES.set(key, Math.max(0, (VOTES.get(key) || 0) + (on ? -1 : 1))); paint(); store.set("fdx-voted", [...myVotes]); toast("Your like didn't go through. Try again in a moment."); }
    };
    paint(); return b;
  }
  const CUR = { USD: "$", EUR: "€", GBP: "£", ILS: "₪", JPY: "¥", NZD: "NZ$", AUD: "A$", CAD: "C$", CHF: "CHF ", SEK: "SEK ", DKK: "DKK ", NOK: "NOK " };
  const fmtPrice = p => !p ? null : p.amount === 0 ? "Free" : (CUR[p.currency] || p.currency + " ") + (Number.isInteger(p.amount) ? p.amount : p.amount.toFixed(2)) + "/weight";
  function foundryCard(x) {
    const fd = FOUNDRY.get(x.id) || {};
    const c = el("div", "fcard2"); c.tabIndex = 0; c.setAttribute("role", "button"); c.setAttribute("aria-label", "Rank " + x.name);
    const head = el("div", "fc2head"); head.append(el("div", "fc2name", x.name), heartBtn("foundry:" + x.id, x.name));
    const sh = el("div", "fc2shot");
    if (fd.shotId) { const img = el("img"); img.src = "shots/" + fd.shotId.split("/").map(encodeURIComponent).join("/") + ".thumb.webp" + (fd.shotAt ? "?v=" + (Date.parse(fd.shotAt) || 0) : ""); img.alt = ""; img.loading = "lazy"; img.decoding = "async"; sh.append(img); }
    const foot = el("div", "fc2foot"); const tags = el("div", "jtags");
    (fd.tags || []).slice(0, 2).forEach(t => tags.append(el("span", "", t)));
    const pr = fmtPrice(fd.price); if (pr && !(fd.price.amount === 0 && (fd.tags || []).includes("Free"))) tags.append(el("span", "", pr));
    const n = Math.min(x.n, TIER_MAX);
    foot.append(tags, el("span", "fc2more", n + (n === 1 ? " font" : " fonts") + " →"));
    c.append(head, sh, foot);
    c.onclick = () => tlStart(x.id);
    c.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && e.target === c) { e.preventDefault(); tlStart(x.id); } };
    return c;
  }
  function tlLobby() {
    tl = null; app.replaceChildren();
    const head = el("div", "tlhead"); head.append(el("h1", "", "Tier List"), el("p", "", "Pick a foundry and rank its fonts from S to D. Every tier list counts towards the popularity order on the Fonts tab."));
    app.append(head);
    const all = tierFoundries(), mine = myTiers();
    const doneF = new Set(TIER_FONTS.filter(f => mine[f.id]).map(f => f.foundryId));
    const fresh = all.filter(x => !doneF.has(x.id));
    const pick = shuffle(fresh.length >= 9 ? fresh : all).slice(0, 9);
    const grid = el("div", "fgridl"); pick.forEach(x => grid.append(foundryCard(x))); app.append(grid);
    const row = el("div", "tlactions"); const sel = el("select", "fsel"); sel.setAttribute("aria-label", "Choose a foundry");
    sel.append(Object.assign(el("option", "", "Or choose any foundry…"), { value: "" }));
    for (const x of all) sel.append(Object.assign(el("option", "", `${x.name} (${x.n})${doneF.has(x.id) ? " ✓" : ""}`), { value: x.id }));

    row.append(sel, btn("Surprise me", false, () => tlStart((fresh.length ? fresh : all)[Math.floor(Math.random() * (fresh.length || all.length))].id)));
    app.append(row);
  }
  function tlStart(foundryId) {
    const mine = myTiers();
    // big catalogues: a round of 12, the ones you haven't ranked yet first
    const list = shuffle(TIER_FONTS.filter(f => f.foundryId === foundryId)).sort((a, b) => (mine[a.id] ? 1 : 0) - (mine[b.id] ? 1 : 0)).slice(0, TIER_MAX);
    tl = { foundryId, fonts: list, place: new Map(list.filter(f => mine[f.id]).map(f => [f.id, mine[f.id]])), sel: null };
    tlBoard();
  }
  function tlBoard() {
    app.replaceChildren();
    const name = MAKER.get(tl.foundryId) || "";
    const bar = el("div", "tlbar"); const cnt = el("span", "cnt"); const acts = el("div", "acts");
    bar.append(el("h2", "", "Rank " + name), el("span", "grow"), cnt, acts); app.append(bar);
    const board = el("div", "tierboard"); const rows = new Map();
    const byId = new Map(tl.fonts.map(f => [f.id, f]));
    const put = (id, t) => { if (t) tl.place.set(id, t); else tl.place.delete(id); tl.sel = null; draw(); };
    const zone = (node, t) => {
      node.addEventListener("dragover", e => { e.preventDefault(); node.classList.add("drop"); });
      node.addEventListener("dragleave", () => node.classList.remove("drop"));
      node.addEventListener("drop", e => { e.preventDefault(); node.classList.remove("drop"); const id = e.dataTransfer.getData("text/plain"); if (byId.has(id)) put(id, t); });
      node.addEventListener("click", e => { if (tl.sel && !e.target.closest(".tcard")) put(tl.sel, t); });
    };
    for (const [v, L] of TIERS) {
      const r = el("div", "trow t" + v); const lab = el("button", "tlab", L); lab.type = "button"; lab.setAttribute("aria-label", "Put the selected font in tier " + L);
      const cards = el("div", "tcards"); r.append(lab, cards); zone(r, v); rows.set(v, { r, cards }); board.append(r);
    }
    const poolHead = el("p", "tpoolhead", "Unranked");
    const pool = el("div", "tpool"); zone(pool, 0);
    pool.title = "Drag a font into a tier, or tap it and then a tier. Keyboard: S, A, B, C, D (0 to unrank).";
    const save = btn("Save my tier list →", true, () => tlSave());
    acts.append(save, btn("Pick another foundry", false, tlLobby));
    app.append(board, poolHead, pool);
    function card(f) {
      const c = el("button", "tcard"); c.type = "button"; c.draggable = true; c.dataset.id = f.id;
      c.setAttribute("aria-pressed", tl.sel === f.id); c.setAttribute("aria-label", f.name + (tl.place.get(f.id) ? ", tier " + letter(tl.place.get(f.id)) : ", unranked"));
      c.append(specCard(f)); c.title = f.name;
      c.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", f.id); e.dataTransfer.effectAllowed = "move"; c.classList.add("dragging"); });
      c.addEventListener("dragend", () => c.classList.remove("dragging"));
      c.onclick = e => { e.stopPropagation(); tl.sel = tl.sel === f.id ? null : f.id; draw(f.id); };
      c.onkeydown = e => {
        const k = e.key.toUpperCase(); const hit = TIERS.find(([, L]) => L === k);
        if (hit || k === "0") { e.preventDefault(); put(f.id, hit ? hit[0] : 0); app.querySelector(`.tcard[data-id="${CSS.escape(f.id)}"]`)?.focus(); }
      };
      return c;
    }
    function draw(focusId) {
      for (const { cards } of rows.values()) cards.replaceChildren();
      pool.replaceChildren();
      for (const f of tl.fonts) (tl.place.get(f.id) ? rows.get(tl.place.get(f.id)).cards : pool).append(card(f));
      if (!pool.children.length) pool.append(el("span", "empty", "All ranked. Save it, or keep moving fonts around."));
      for (const { r } of rows.values()) r.classList.toggle("armed", !!tl.sel);
      cnt.textContent = `${tl.place.size} / ${tl.fonts.length} ranked`;
      save.disabled = tl.place.size < Math.min(3, tl.fonts.length);
      if (focusId) app.querySelector(`.tcard[data-id="${CSS.escape(focusId)}"]`)?.focus();
    }
    for (const [v] of TIERS) rows.get(v).r.querySelector(".tlab").onclick = e => { e.stopPropagation(); if (tl.sel) put(tl.sel, v); };
    draw();
  }
  async function tlSave() {
    const ratings = [...tl.place].map(([f, t]) => ({ f, t }));
    const mine = myTiers(); const before = {};
    for (const { f, t } of ratings) { before[f] = mine[f] || 0; mine[f] = t; }
    try {
      const r = await fetch(VOTE_API.url + "/rest/v1/rpc/rate_tiers", { method: "POST", headers: { apikey: VOTE_API.key, Authorization: "Bearer " + VOTE_API.key, "Content-Type": "application/json" }, body: JSON.stringify({ p_voter: voterId, p_ratings: ratings }) });
      if (!r.ok) throw new Error(r.status);
    } catch (e) { toast("Your tier list didn't save. Try again in a moment."); return; }
    store.set("fdx-tiers", mine);
    // count it locally too, so the result shows your list straight away
    for (const { f, t } of ratings) { const s = TIER_SCORES.get(f) || { n: 0, total: 0 }; if (before[f]) s.total += t - before[f]; else { s.n++; s.total += t; } TIER_SCORES.set(f, s); }
    tlResult();
  }
  function tlResult() {
    app.replaceChildren();
    const name = MAKER.get(tl.foundryId) || "";
    const head = el("div", "tlres"); head.append(el("h1", "", "Saved. Here’s the crowd."), el("p", "", "Your tiers next to everyone’s average. These scores now help order the Fonts tab.")); app.append(head);
    const panel = el("div", "panel tvs"); panel.setAttribute("aria-label", "Tier list for " + name);
    const ranked = tl.fonts.filter(f => tl.place.has(f.id)).sort((a, b) => {
      const s = f => { const x = TIER_SCORES.get(f.id); return x && x.n ? x.total / x.n : 0; };
      return s(b) - s(a) || tl.place.get(b.id) - tl.place.get(a.id);
    });
    const th = el("div", "tcmp thead"); th.append(el("span", "", "Font"), el("span", "", "You"), el("span", "", "Crowd")); panel.append(th);
    ranked.forEach((f, i) => {
      const s = TIER_SCORES.get(f.id) || { n: 0 };
      const r = el("div", "tcmp"); const tx = el("div"); tx.append(el("div", "fname", f.name), el("div", "fby", s.n + (s.n === 1 ? " ranking" : " rankings")));
      const you = tl.place.get(f.id), crowd = crowdTier(f.id);
      r.append(el("span", "mono", String(i + 1)), specCard(f), tx, el("span", "tchip t" + you, letter(you)), el("span", "tchip t" + crowd, letter(crowd)));
      panel.append(r);
    });
    app.append(panel);
    const row = el("div", "row");
    row.append(btn("Rank another foundry →", true, tlLobby), btn("Change my tiers", false, tlBoard));
    const open = el("a", "btn", "See it on the Fonts tab ↗"); open.href = "./#fonts?foundry=" + encodeURIComponent(tl.foundryId); row.append(open);
    app.append(row);
  }

  /* =================== routing =================== */
  function route() {
    const g = (location.hash || "#tiers").slice(1);
    document.querySelectorAll(".games a").forEach(a => a.dataset.g === g ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    if (!FONTS.length) return;
    $("#proto").hidden = g === "tiers"; // tier lists are real and shared, not simulated
    if (g === "quiz") quizIntro(); else if (g === "bracket") { br ? brOverview() : brNew("grotesk"); } else if (g === "tiers") { tl ? tlBoard() : tlLobby(); } else ccLobby();
    window.scrollTo({ top: 0 });
  }
  window.addEventListener("hashchange", route);
  document.addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("input,textarea")) return;
    const g = (location.hash || "#tiers").slice(1);
    const keys = g === "quiz" ? qz && qz.keys : g === "bracket" ? br && br.keys : null;
    if (!keys) return;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { const cards = app.querySelectorAll(".choice:not(:disabled)"); const c = cards[e.key === "ArrowLeft" ? 0 : 1]; if (c) { e.preventDefault(); c.click(); } }
  });

  (async () => {
    try {
      const r = await fetch("data/data.json", { cache: "no-cache" }); const snap = await r.json();
      for (const f of snap.foundries || []) { MAKER.set(f.id, f.kind === "Typeface" ? (f.by || f.name) : f.name); FOUNDRY.set(f.id, f); }
      // uniform Latin specimens only: every card looks the same, so people judge the letters
      FONTS = (snap.fonts || []).filter(f => f.shot === "uniform" && f.uniformScript === "latin" && f.shotId && f.category && /^https?:/.test(f.url));
      // tier lists: every font with a uniform specimen (Hebrew ones too), libraries left out
      const libs = new Set((snap.foundries || []).filter(f => f.kind === "Library").map(f => f.id));
      TIER_FONTS = (snap.fonts || []).filter(f => f.shot === "uniform" && f.shotId && !libs.has(f.foundryId) && /^https?:/.test(f.url));
    } catch (e) { app.replaceChildren(el("p", "empty", "Couldn’t load the fonts. Try again in a moment.")); return; }
    try {
      const r = await fetch(VOTE_API.url + "/rest/v1/vote_counts?select=font_id,n", { headers: { apikey: VOTE_API.key, Authorization: "Bearer " + VOTE_API.key } });
      if (r.ok) (await r.json()).forEach(x => VOTES.set(x.font_id, x.n));
    } catch (e) {}
    await loadTierScores();
    route();
  })();
})();
