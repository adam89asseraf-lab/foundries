<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Found rizz — Type &amp; foundry index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&family=Young+Serif&family=Rethink+Sans:wght@700&family=Inter+Tight:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Host+Grotesk:wght@700&family=Funnel+Display:wght@700&family=Crimson+Pro:wght@700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=sharpie@700&f[]=clash-grotesk@700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a type-specimen index. Bordered tiles share hairlines like a printed specimen grid; one sticky toolbar filters, tests and adds. */
:root{
  --paper:#ededea; --tile:#f7f7f5; --ink:#121214; --muted:#6b6b72; --line:#cfcfcb; --accent:#2b36e8; --accent-ink:#ffffff;
  --display:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body:"Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono:"DM Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#0e0e11; --tile:#16161a; --ink:#ececee; --muted:#8e8e98; --line:#2a2a31; --accent:#8790ff; --accent-ink:#0e0e11; color-scheme:dark; }
}
:root[data-theme="dark"]{ --paper:#0e0e11; --tile:#16161a; --ink:#ececee; --muted:#8e8e98; --line:#2a2a31; --accent:#8790ff; --accent-ink:#0e0e11; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding:0 clamp(16px,3vw,40px)}

/* Masthead */
header.mast{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;padding-top:clamp(28px,5vw,56px);padding-bottom:20px;border-bottom:1px solid var(--ink)}
.mast h1{font:800 clamp(56px,11vw,152px)/.85 var(--display);font-variation-settings:"wdth" 78,"opsz" 96;letter-spacing:-.035em;margin:0;text-wrap:balance}
.mast h1 .title{display:inline-block;font-synthesis:none}
/* Apfel Grotezk by Collletttivo (SIL Open Font License), served from its GitHub repo via jsDelivr */
@font-face{font-family:"Apfel Grotezk";font-weight:700;font-style:normal;font-display:swap;src:url("https://cdn.jsdelivr.net/gh/collletttivo/apfel-grotezk@main/fonts/ApfelGrotezk-Fett.woff2") format("woff2"),url("https://cdn.jsdelivr.net/gh/collletttivo/apfel-grotezk@main/fonts/ApfelGrotezk-Fett.woff") format("woff")}
.mast h1 sup{font:400 13px/1 var(--mono);letter-spacing:0;vertical-align:baseline;margin-left:.6em;color:var(--muted)}
.stats{display:flex;gap:28px;font:400 12px/1.3 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stats b{display:block;font:600 28px/1 var(--display);color:var(--ink);letter-spacing:-.02em;text-transform:none;font-variant-numeric:tabular-nums;margin-bottom:4px}

/* Toolbar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 0}
.bar-row + .bar-row{border-top:1px solid var(--line)}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--tile);padding:0 12px;height:38px;border-radius:999px}
.search input{border:0;background:transparent;outline:none;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font:500 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{opacity:.55;margin-left:6px;font-variant-numeric:tabular-nums}
.sep{width:1px;height:24px;background:var(--line)}
select.ctl{height:38px;border:1px solid var(--line);background:var(--tile);border-radius:999px;padding:0 12px;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;height:38px}
.seg button{border:0;background:transparent;padding:0 14px;cursor:pointer;font:500 12px/1 var(--mono);text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{height:38px;border-radius:999px;border:1px solid var(--ink);background:transparent;padding:0 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{height:32px;padding:0 12px;font-size:13px}
.spacer{flex:1}
.tester{display:flex;align-items:center;gap:12px;flex:1 1 360px}
.tester input[type=text]{flex:1;height:38px;border:1px solid var(--line);background:var(--tile);border-radius:999px;padding:0 14px}
.tester label{font:500 12px/1 var(--mono);text-transform:uppercase;color:var(--muted);white-space:nowrap}
input[type=range]{accent-color:var(--accent);width:120px}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));border-left:1px solid var(--line);margin:24px 0 64px}
.card{position:relative;background:var(--tile);border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-top:1px solid var(--line);margin-top:-1px;display:flex;flex-direction:column;min-height:300px;text-decoration:none;transition:background .15s}
.card:hover{background:var(--ink);color:var(--paper)}
.card:hover .meta,.card:hover .by,.card:hover .note{color:var(--paper);opacity:.7}
.card:hover .tag{border-color:currentColor}
.card a.hit{position:absolute;inset:0;z-index:1}
.meta{display:flex;justify-content:space-between;gap:12px;padding:14px 16px 0;font:400 11px/1.3 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.meta .num{font-variant-numeric:tabular-nums}
.specimen{flex:1;display:flex;align-items:center;padding:20px 16px;overflow:hidden}
.specimen .name{font:700 46px/.95 var(--display);font-variation-settings:"wdth" 82,"opsz" 72;letter-spacing:-.025em;overflow-wrap:anywhere;text-wrap:balance}
.specimen .name[dir=rtl]{font-family:var(--body);font-weight:600}
.specimen .test{font-size:var(--tsize,48px);line-height:1.05;overflow-wrap:anywhere}
.foot{padding:0 16px 16px;display:grid;gap:10px;align-content:start;flex:1}
.by{font-size:14px;color:var(--muted)}
.by strong{color:inherit;font-weight:600}
.note{font-size:13px;color:var(--muted);max-width:60ch}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:500 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--line);border-radius:999px;padding:5px 8px}
.tag.kind{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card:hover .tag.kind{background:var(--paper);color:var(--ink)}
.tag.spec{border-color:var(--accent);color:var(--accent)}
.shot{position:relative;margin:12px 16px 0;aspect-ratio:16/10;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.card:hover .shot{border-color:transparent}
.cname{font:700 26px/1 var(--display);font-variation-settings:"wdth" 82,"opsz" 48;letter-spacing:-.02em;overflow-wrap:anywhere;text-wrap:balance}
.cname[dir=rtl]{font-family:var(--body);font-weight:600}
.pending{display:flex;align-items:center;justify-content:center;height:100%;font:500 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center;padding:12px}
.fallback{display:flex;align-items:center;justify-content:center;height:100%;padding:16px;font:800 40px/.95 var(--display);font-variation-settings:"wdth" 78,"opsz" 72;letter-spacing:-.03em;text-align:center;text-wrap:balance;background:var(--ink);color:var(--paper)}
.fallback[dir=rtl]{font-family:var(--body)}
.tag.price{border-color:var(--ink);font-variant-numeric:tabular-nums}
.card:hover .tag.price{border-color:currentColor}
.row .rprice{font:500 12px var(--mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag.new{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.newline{font-size:13px;color:var(--accent);font-weight:600}
.card:hover .newline{color:var(--paper)}
.rthumb{width:72px;aspect-ratio:16/10;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:4px;display:block}
.chip.newchip[aria-pressed="false"]{border-color:var(--accent);color:var(--accent)}
.tabs-main{display:flex;gap:4px;margin-top:18px}
.tabs-main a{font:600 15px/1 var(--body);text-decoration:none;padding:10px 16px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.tabs-main a .n{font:400 12px var(--mono);margin-left:6px;font-variant-numeric:tabular-nums}
.tabs-main a[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.fgrid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:16px;margin:24px 0 64px}
.fcard{position:relative;display:flex;flex-direction:column;background:var(--tile);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fcard:hover{border-color:var(--ink)}
.fcard a.hit{position:absolute;inset:0;z-index:1}
.fcard .fshot{aspect-ratio:5/2;background:#fff;border-bottom:1px solid var(--line);overflow:hidden}
.fcard .fshot .fallback{font-size:30px}
.fcard .fshot img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.fcard .fbody{padding:12px 14px 14px;display:grid;gap:6px}
.fcard .fname{font:700 20px/1.1 var(--display);font-variation-settings:"wdth" 85;letter-spacing:-.015em;overflow-wrap:anywhere}
.fcard .fmeta{display:flex;justify-content:space-between;gap:8px;align-items:center;font:400 11px/1.3 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.linkbtn{position:relative;z-index:2;background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.linkbtn:hover{color:var(--accent)}
.fbar-select{max-width:240px}
/* foundry picker: type-ahead with chips (multi-select) */
.fpick{position:relative;flex:1 1 200px;max-width:320px;min-width:160px}
.fpfield{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:38px;padding:4px 26px 4px 8px;border-bottom:1px solid var(--ink);cursor:text;position:relative}
.fpchips{display:contents}
.fpchip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 5px 8px;background:var(--ink);color:var(--paper);border:0;font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.01em;cursor:pointer;max-width:100%}
.fpchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fpchip b{font:400 14px/1 var(--ui)}
.fpchip:hover b,.fpchip:focus-visible b{color:var(--accent)}
.fpchip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fpinput{flex:1 1 70px;min-width:70px;border:0;background:transparent;font:400 15px/1 var(--ui);color:var(--ink);padding:6px 0;outline:none}
.fpinput::placeholder{color:var(--ink)}
.fpick.has .fpinput::placeholder{color:var(--muted)}
.fpchev{position:absolute;right:8px;top:50%;margin-top:-3px;color:var(--ink);pointer-events:none;transition:transform .15s}
.fpick.open .fpchev{transform:rotate(180deg)}
.fppanel{position:absolute;left:0;top:calc(100% + 6px);z-index:40;width:max(100%,360px);background:var(--tile);border:1px solid var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.fppanel[hidden]{display:none}
.fphead{padding:10px 12px 4px;font:500 11px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.01em;color:var(--muted)}
.fplist{list-style:none;margin:0;padding:0 0 4px;max-height:320px;overflow-y:auto;overscroll-behavior:contain}
.fplist li{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;font:400 15px/1.2 var(--ui)}
.fplist li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fplist li .nm b{font-weight:600}
.fplist li .ct{font:500 12px/1 var(--mono);color:var(--muted)}
.fplist li .bx{flex:none;width:16px;height:16px;border:1px solid var(--ink);display:grid;place-items:center}
.fplist li[aria-selected="true"] .bx{background:var(--ink)}
.fplist li[aria-selected="true"] .bx::after{content:"";width:9px;height:5px;border:solid var(--paper);border-width:0 0 1.6px 1.6px;transform:translateY(-1px) rotate(-45deg)}
.fplist li[aria-selected="true"] .nm{font-weight:600}
.fplist li.act{background:var(--grey)}
.fplist .none{cursor:default;color:var(--muted)}
.fplist li.fav{border-bottom:1px solid var(--line)}
.fplist li.fav .nm::before{content:"♥ ";color:var(--accent)}
.fplist li.fav.off{cursor:default;color:var(--muted);font-size:13px}
.fplist li.fav.off .bx{border-color:var(--line)}
.fpkeys{display:flex;flex-wrap:wrap;gap:14px;padding:9px 12px;border-top:1px solid var(--line);font:500 11px/1 var(--mono);text-transform:uppercase;color:var(--muted)}
@media (hover:none){.fpkeys{display:none}}
.morefonts{position:relative;z-index:2;justify-self:start;margin-top:2px}
.edit{position:absolute;top:10px;right:10px;z-index:2;opacity:0;border:1px solid currentColor;background:var(--paper);color:var(--ink);border-radius:999px;font:500 11px/1 var(--mono);text-transform:uppercase;padding:6px 10px;cursor:pointer}
.card:hover .edit,.edit:focus-visible{opacity:1}

/* List */
.list{margin:24px 0 64px;border-top:1px solid var(--ink)}
.row{position:relative;display:grid;grid-template-columns:48px 72px minmax(0,2.2fr) minmax(0,1.4fr) 110px minmax(0,1.6fr) minmax(0,1.3fr) 110px;gap:16px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.row:hover{background:var(--tile)}
.row a.hit{position:absolute;inset:0;z-index:1}
.row .rn{font:400 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.row .rname{font:700 22px/1.1 var(--display);font-variation-settings:"wdth" 85;letter-spacing:-.015em;overflow-wrap:anywhere}
.row .rby,.row .rdom{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.row .rdom{font-family:var(--mono);font-size:12px}
.row .edit{position:static;opacity:1;justify-self:end}
.row .edit{opacity:.0}
.row:hover .edit,.row .edit:focus-visible{opacity:1}

.sentinel{height:1px;margin-bottom:64px}
.fgrid:has(+ .sentinel),.list:has(+ .sentinel){margin-bottom:0}
.empty,.status{padding:48px 0;color:var(--muted);font-size:15px}
.status{padding:10px 0;font:400 12px var(--mono)}
.status:empty{display:none}

/* Dialog */
.scrim{position:fixed;inset:0;background:rgba(10,10,14,.55);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:20;overflow:auto}
.scrim.open{display:flex}
.dialog{background:var(--paper);color:var(--ink);width:min(560px,100%);border:1px solid var(--ink);border-radius:14px;padding:24px;display:grid;gap:16px}
.dialog h2{margin:0;font:800 34px/1 var(--display);font-variation-settings:"wdth" 80;letter-spacing:-.02em}
.field{display:grid;gap:6px}
.field label{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--tile);border-radius:8px;padding:10px 12px;width:100%}
.field textarea{min-height:140px;resize:vertical;font-family:var(--mono);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12px;color:var(--muted)}
.err{color:#c4231b;font-size:13px}
.err:empty{display:none}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.danger{border-color:#c4231b;color:#c4231b}
.danger:hover{background:#c4231b;color:#fff}
.tabs{display:flex;gap:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

.filtersBtn{display:none}
.sliders{gap:20px!important}
.range{position:relative;flex:none;width:160px;height:20px;margin:0 8px}
.moods .moodtitle{font:500 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.slider.mood{gap:8px}
.slider.mood .pole{text-transform:none;letter-spacing:0;font:400 13px/1 var(--body);color:var(--muted);min-width:0}
.slider.mood .range{width:110px}
.range .rtrack,.range .rfill{position:absolute;top:8px;height:4px;border-radius:2px}
.range .rtrack{left:0;right:0;background:var(--line)}
.range .rfill{background:var(--accent)}
.range input{position:absolute;inset:0;width:100%!important;height:20px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.range input::-webkit-slider-runnable-track{height:20px;background:transparent}
.range input::-moz-range-track{height:4px;background:transparent}
.range input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:16px;height:16px;margin-top:2px;border-radius:50%;background:var(--accent);border:2px solid var(--paper);box-shadow:0 0 0 1px var(--accent);cursor:pointer}
.range input::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--paper);box-shadow:0 0 0 1px var(--accent);cursor:pointer}
.range input:disabled::-webkit-slider-thumb{background:var(--line);box-shadow:none}
.range input:focus-visible::-webkit-slider-thumb{outline:2px solid var(--accent);outline-offset:2px}
.slider{display:flex;align-items:center;gap:10px}
.slider label{font:500 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.slider output{font:500 12px/1 var(--mono);min-width:44px;font-variant-numeric:tabular-nums}
.slider input[type=range]{width:140px}
.chip.cat{font-family:var(--body);text-transform:none;letter-spacing:0;font-size:13px}
.fcard .fprops{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:700px){
  .filtersBtn{display:inline-flex;align-items:center;gap:6px;height:38px;flex:0 0 auto}
  .filtersBtn .n{font:500 11px var(--mono);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 6px}
  .filtersBtn .n:empty{display:none}
  .bar .bar-row{gap:8px;padding:8px 0;flex-wrap:wrap}
  .bar .search{flex:1 1 0;min-width:0}
  .bar:not(.open) .bar-row > :not(.search):not(.filtersBtn){display:none!important}
  .bar:not(.open) .bar-row + .bar-row{display:none!important}
  .bar.open{max-height:72vh;overflow-y:auto;box-shadow:0 12px 24px rgba(0,0,0,.18)}
  .bar.open .chips{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:2px;scrollbar-width:none}
  .bar.open .sep{display:none}
  .bar.open .fbar-select{max-width:none;flex:1 1 100%}
  .fppanel{position:static;width:auto;box-shadow:none;margin-top:6px}
  .fplist{max-height:44vh}
  .fplist li{padding:12px}
  .tester{flex-wrap:wrap}
  header.mast{padding-top:20px}
  .mast h1{font-size:60px}
  .stats{gap:16px}.stats b{font-size:22px}
}
@media (max-width:820px){
  .row{grid-template-columns:36px 72px minmax(0,1fr) auto;}
  .row .rby,.row .rtags,.row .rdom,.row .rkind{display:none}
  .row .edit{opacity:1}
}
@media (max-width:560px){
  header.mast{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .specimen .name{font-size:40px}
  .edit{opacity:1}
}
.editlink{font:400 12px/1 var(--mono);color:var(--muted);text-decoration:none;align-self:center;margin-left:8px}
.editlink:hover{color:var(--accent);text-decoration:underline}
.zoom{position:absolute;top:10px;right:10px;z-index:2;opacity:0;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;width:32px;height:32px;display:grid;place-items:center;cursor:zoom-in;transition:opacity .15s}
.card:hover .zoom,.fcard:hover .zoom,.zoom:focus-visible{opacity:1}
@media (hover:none){.zoom{opacity:1}}
.card .zoom{top:22px;right:24px}
.lightbox{position:fixed;inset:0;z-index:40;background:rgba(10,10,14,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;cursor:zoom-out}

/* sliders: grey track, green fill, green diamond handles */
.slider input[type=range]:not(.range input){-webkit-appearance:none;appearance:none;height:16px;background:linear-gradient(var(--accent),var(--accent)) 0 50%/var(--p,0%) 4px no-repeat,linear-gradient(var(--line),var(--line)) 0 50%/100% 4px no-repeat;cursor:pointer}

<script>
(() => {
  const $ = s => document.querySelector(s);
  const KINDS = ["Foundry","Library"]; // single typefaces live in the Fonts list, not here
  const KIND_LABEL = {Foundry:"Foundries", Typeface:"Typefaces", Library:"Libraries & tools"};
  let items = [];           // foundries
  let fonts = [];           // individual typefaces
  // ---- Votes (Supabase). Paste the project URL and its public anon key to switch voting on; empty = no vote buttons.
  const VOTES = { url: "https://lulglxebjchreghaexjd.supabase.co", key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1bGdseGViamNocmVnaGFleGpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0MjMzNTgsImV4cCI6MjExMDk5OTM1OH0.G7g865fMppnvLe9khxq96f67obFMWCdNqHc8jmFX4w4" };
  const votesOn = !!(VOTES.url && VOTES.key);
  const voteCount = new Map();   // font id -> number of votes
  let myVotes = new Set();       // font ids this browser voted for
  let voterId = "";
  try { voterId = localStorage.getItem("fdx-voter") || ""; if (!voterId) { voterId = crypto.randomUUID(); localStorage.setItem("fdx-voter", voterId); } myVotes = new Set(JSON.parse(localStorage.getItem("fdx-voted") || "[]")); } catch(e) { voterId = voterId || crypto.randomUUID(); }
  const saveMine = () => { try { localStorage.setItem("fdx-voted", JSON.stringify([...myVotes])); } catch(e){} };
  const sb = (path, opt = {}) => fetch(VOTES.url.replace(/\/$/, "") + "/rest/v1/" + path, { ...opt, headers: { apikey: VOTES.key, Authorization: "Bearer " + VOTES.key, "Content-Type": "application/json", ...(opt.headers||{}) } });
  async function loadVotes(){
    if (!votesOn) return;
    try {
      for (let from = 0; ; from += 1000) {
        const r = await sb("vote_counts?select=font_id,n", { headers: { Range: `${from}-${from+999}` } });
        if (!r.ok) break;
        const rows = await r.json(); rows.forEach(x => voteCount.set(x.font_id, x.n));
        if (rows.length < 1000) break;
      }
      render();
    } catch(e) {}
  }
  // popularity: tier lists from the games page (S=5 … D=1), averaged with a pull towards B so one ranking
  // can't jump a font to the top; hearts add a little on top. Unranked fonts sit at B and keep board order.
  const tierScore = new Map(); // font id -> { n, total }
  const TIER_PRIOR = 3, TIER_WEIGHT = 3;
  const popScore = f => { const t = tierScore.get(f.id) || { n: 0, total: 0 }; return (t.total + TIER_PRIOR * TIER_WEIGHT) / (t.n + TIER_WEIGHT) + 0.1 * Math.log2(1 + (voteCount.get(f.id) || 0)); };
  async function loadTierScores(){
    if (!votesOn) return;
    try {
      for (let from = 0; ; from += 1000) {
        const r = await sb("tier_scores?select=font_id,n,total", { headers: { Range: `${from}-${from+999}` } });
        if (!r.ok) break;
        const rows = await r.json(); rows.forEach(x => tierScore.set(x.font_id, { n: x.n, total: x.total }));
        if (rows.length < 1000) break;
      }
      render();
    } catch(e) {}
  }
  // foundries are voted on in the same table, under "foundry:<id>"
  const fkey = id => "foundry:" + id;
  const foundryVotes = id => voteCount.get(fkey(id)) || 0;
  async function toggleVote(key, btn){
    const on = !myVotes.has(key);
    const paint = () => document.querySelectorAll(".vote").forEach(b => { if (b.dataset.key !== key) return; b.setAttribute("aria-pressed", myVotes.has(key)); b.querySelector(".vn").textContent = voteCount.get(key) || ""; });
    on ? myVotes.add(key) : myVotes.delete(key);
    voteCount.set(key, Math.max(0, (voteCount.get(key) || 0) + (on ? 1 : -1))); paint(); saveMine();
    try {
      const r = await sb("rpc/" + (on ? "vote" : "unvote"), { method: "POST", body: JSON.stringify({ p_font: key, p_voter: voterId }) });
      if (!r.ok) throw 0;
    } catch(e) {
      on ? myVotes.delete(key) : myVotes.add(key);
      voteCount.set(key, Math.max(0, (voteCount.get(key) || 0) + (on ? -1 : 1))); paint(); saveMine();
      toast("Your vote didn't go through. Try again in a moment.");
    }
  }
  function voteBtn(f, key = f.id){
    const b = el("button","vote"); b.type = "button"; b.dataset.key = key;
    b.setAttribute("aria-pressed", myVotes.has(key)); b.setAttribute("aria-label", "Vote for " + f.name); b.title = "Vote";
    b.innerHTML = '<span class="vn"></span><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path transform="translate(1.875 3.75)" d="M8.125 13.75S0 9.375 0 4.219A4.22 4.22 0 0 1 4.219 0C5.984 0 7.495.962 8.125 2.5 8.755.962 10.266 0 12.031 0A4.22 4.22 0 0 1 16.25 4.219C16.25 9.375 8.125 13.75 8.125 13.75Z"/></svg>';
    b.querySelector(".vn").textContent = voteCount.get(key) || "";
    b.onclick = e => { e.preventDefault(); e.stopPropagation(); toggleVote(key, b); };
    return b;
  }
  // ---- Compare: up to 6 fonts side by side (kept in this browser)
  const CMP_MAX = 6;
  let cmp = [];
  try { cmp = JSON.parse(localStorage.getItem("fdx-compare") || "[]").filter(x => typeof x === "string").slice(0, CMP_MAX); } catch(e) {}
  const saveCmp = () => { try { localStorage.setItem("fdx-compare", JSON.stringify(cmp)); } catch(e){} };
  const CMP_ICON = '<svg viewBox="0 0 20 20" aria-hidden="true"><g class="off"><rect x="2.75" y="2.75" width="14.5" height="14.5" rx="2"/><path d="M10 6.5v7M6.5 10h7"/></g><g class="on"><rect x="2.75" y="2.75" width="14.5" height="14.5" rx="2" fill="currentColor"/><path d="M6.5 10.2l2.4 2.4 4.6-5" stroke="var(--paper)" stroke-width="1.8"/></g></svg>';
  function cmpBtn(f){
    const b = el("button","cmpbtn"); b.type = "button"; b.dataset.id = f.id; b.title = "Compare";
    b.innerHTML = CMP_ICON; paintCmpBtn(b, f.name);
    b.onclick = e => { e.preventDefault(); e.stopPropagation(); toggleCmp(f.id); };
    return b;
  }
  function paintCmpBtn(b, name){
    const on = cmp.includes(b.dataset.id); name = name || (fonts.find(x => x.id === b.dataset.id) || {}).name || "font";
    b.setAttribute("aria-pressed", on); b.setAttribute("aria-label", on ? `Remove ${name} from compare` : `Add ${name} to compare`);
    const card = b.closest(".fcard"); if (card) card.classList.toggle("cmpsel", on);
  }
  function toggleCmp(id){
    const i = cmp.indexOf(id);
    if (i >= 0) cmp.splice(i, 1);
    else { if (cmp.length >= CMP_MAX) { toast(`You can compare up to ${CMP_MAX} fonts. Remove one first.`); return; } cmp.push(id); }
    saveCmp(); syncCmp();
  }
  function syncCmp(){
    cmp = cmp.filter(id => fonts.some(f => f.id === id));
    document.querySelectorAll(".cmpbtn").forEach(b => paintCmpBtn(b));
    const tray = $("#cmpTray"), box = $("#cmpThumbs"); box.replaceChildren();
    tray.hidden = !cmp.length; document.body.classList.toggle("tray", !!cmp.length);
    for (const id of cmp) {
      const f = fonts.find(x => x.id === id); if (!f) continue;
      const t = el("button","cmpthumb"); t.type = "button"; t.title = "Remove " + f.name; t.setAttribute("aria-label", "Remove " + f.name + " from compare");
      if (f.shotId) { const img = el("img"); img.src = shotUrl(f); img.alt = ""; t.append(img); } else t.append(el("span","", f.name));
      t.append(el("span","x","✕")); t.onclick = () => toggleCmp(id); box.append(t);
    }
    $("#cmpCount").textContent = `${cmp.length} / ${CMP_MAX}`;
    const go = $("#cmpOpen"); go.disabled = cmp.length < 2; go.textContent = cmp.length < 2 ? "Pick one more" : `Compare ${cmp.length}`;
    if (!$("#cmp").hidden) { if (cmp.length) renderCompare(); else closeCompare(); }
  }
  function renderCompare(){
    const grid = $("#cmpGrid"); grid.replaceChildren();
    grid.style.setProperty("--cols", cmp.length <= 3 ? cmp.length : cmp.length === 4 ? 2 : 3);
    $("#cmpTitle").textContent = `Comparing ${cmp.length} font${cmp.length === 1 ? "" : "s"}`;
    for (const id of cmp) {
      const f = fonts.find(x => x.id === id); if (!f) continue;
      const fd = items.find(i => i.id === f.foundryId) || {};
      const col = el("article","cmpcol");
      const sh = el("div","cshot");
      if (cmpText && f.gf) { sh.append(liveText(f)); }
      else if (f.shotId) { const img = el("img"); img.src = shotUrl(f, true); img.alt = "Specimen of " + f.name; img.onerror = () => img.replaceWith(el("div","fallback", f.name)); sh.append(img); } else sh.append(el("div","fallback", f.name));
      const by = el("div","cby", foundryLabel(fd) || "");
      const nm = el("div","cname2", f.name); if (isRTL(f.name)) nm.dir = "rtl";
      const dl = el("dl");
      const rows = [["Category", f.category || "—"], ["Styles", f.styles ? String(f.styles) : "—"], ["Variable", f.variable ? "Yes" : "No"], ["Price / weight", fmtPrice(f.price) || "—"]];
      if (votesOn) rows.push(["Votes", String(voteCount.get(f.id) || 0)]);
      for (const [k, v] of rows) dl.append(el("dt","",k), el("dd","",v));
      const acts = el("div","cacts");
      const a = el("a","", "Open site ↗"); a.href = f.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      const rm = el("button","linkbtn","Remove"); rm.type = "button"; rm.onclick = () => toggleCmp(id);
      acts.append(a, rm);
      if (cmpText && !f.gf) sh.append(Object.assign(el("span","ptag","Preview only"), { title: "A paid font: only the foundry's own screenshot can be shown" }));
      col.append(sh, by, nm, dl, acts); grid.append(col);
    }
    const live = cmp.map(id => fonts.find(x => x.id === id)).filter(f => f && f.gf).length;
    $("#cmpTextNote").textContent = live === cmp.length ? "All of these are free fonts, so each one draws your sentence."
      : live ? `${live} of ${cmp.length} are free fonts and draw your sentence. Paid fonts keep the foundry's screenshot.`
      : "Your sentence works with free Google Fonts and Fontshare fonts. These are paid fonts, so they keep the foundry's screenshot.";
    $("#cmpTextClear").hidden = !cmpText;
  }
  // own sentence: free fonts (Google Fonts, Fontshare) are loaded from their public CSS and draw the text live;
  // paid foundry fonts can't be loaded here, so they stay as screenshots
  let cmpText = ""; try { cmpText = localStorage.getItem("fdx-cmp-text") || ""; } catch(e) {}
  const liveLoaded = new Set();
  function liveFont(f){
    const g = f.gf, w = g.weights && g.weights.length ? g.weights.reduce((a, b) => Math.abs(b - 400) < Math.abs(a - 400) ? b : a) : 400;
    const href = g.provider === "fontshare" ? `https://api.fontshare.com/v2/css?f[]=${encodeURIComponent(g.slug)}@${w}&display=swap`
      : `https://fonts.googleapis.com/css2?family=${encodeURIComponent(g.family).replace(/%20/g, "+")}:wght@${w}&display=swap`;
    if (!liveLoaded.has(href)) { liveLoaded.add(href); document.head.append(Object.assign(document.createElement("link"), { rel: "stylesheet", href })); }
    return { fam: g.family, w };
  }
  function liveText(f){
    const { fam, w } = liveFont(f);
    const d = el("div","clive", cmpText); d.style.fontFamily = `"${fam}", sans-serif`; d.style.fontWeight = w;
    if (isRTL(cmpText)) d.dir = "rtl";
    d.setAttribute("aria-label", `“${cmpText}” in ${f.name}`);
    const fit = () => { let s = 96; d.style.fontSize = s + "px"; while (s > 12 && (d.scrollHeight > d.clientHeight + 1 || d.scrollWidth > d.clientWidth + 1)) { s -= 2; d.style.fontSize = s + "px"; } };
    requestAnimationFrame(fit);
    document.fonts.load(`${w} 40px "${fam}"`, cmpText).then(() => requestAnimationFrame(fit), () => {});
    return d;
  }
  let cmpTextT = 0;
  $("#cmpText").value = cmpText;
  $("#cmpText").addEventListener("input", e => { cmpText = e.target.value.trim() ? e.target.value : ""; try { localStorage.setItem("fdx-cmp-text", cmpText); } catch(e){} clearTimeout(cmpTextT); cmpTextT = setTimeout(renderCompare, 120); });
  $("#cmpTextClear").onclick = () => { cmpText = ""; $("#cmpText").value = ""; try { localStorage.removeItem("fdx-cmp-text"); } catch(e){} renderCompare(); $("#cmpText").focus(); };
  let cmpReturn = null;
  function openCompare(){ if (cmp.length < 2) return; cmpReturn = document.activeElement; renderCompare(); $("#cmp").hidden = false; document.documentElement.style.overflow = "hidden"; $("#cmpClose").focus(); }
  function closeCompare(){ $("#cmp").hidden = true; document.documentElement.style.overflow = ""; if (cmpReturn && cmpReturn.focus) cmpReturn.focus(); }
  const LANGS = [["latin","Latin"],["latin-ext","Extended Latin","Central & Eastern European, Turkish, Baltic"],["cyrillic","Cyrillic"],["greek","Greek"],["hebrew","Hebrew"],["arabic","Arabic"],["vietnamese","Vietnamese"],["devanagari","Devanagari"],["thai","Thai"],["japanese","Japanese"],["korean","Korean"],["chinese-simplified","Chinese"]];
  const fstate = { q:"", foundries:new Set(), kind:null, cat:null, props:new Set(), minStyles:1, minPrice:null, maxPrice:null, mood:[[0,100],[0,100],[0,100],[0,100]], langs:new Set(), card:260, tags:new Set(), onlyNew:false, sort:"popular", showQueued:false, limit:60 };
  const tab = () => location.hash === "#foundries" ? "foundries" : location.hash === "#libraries" ? "libraries" : "fonts";
  let shuffleKey = Math.random();
  const state = { q:"", kind:null, onlyNew:false, tags:new Set(), sort:"order", view:"grid" };
  // grid only (the list view was removed in the design)

  /* ---------- helpers ---------- */
  const safeUrl = u => { try { const x = new URL(String(u).trim()); return /^https?:$/.test(x.protocol) ? x.href : null; } catch(e){ return null; } };
  const host = u => { try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return ""; } };
  const norm = u => { try { const x = new URL(u); return (x.hostname.replace(/^www\./,"") + x.pathname.replace(/\/$/,"")).toLowerCase(); } catch(e){ return String(u).toLowerCase(); } };
  const nameFromUrl = u => { const h = host(u).split(".")[0] || "Untitled"; return h.charAt(0).toUpperCase() + h.slice(1); };
  const isRTL = s => /[֐-׿؀-ۿ]/.test(s || "");
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2200); };
  const parseTags = s => [...new Set(String(s||"").split(",").map(t=>t.trim()).filter(Boolean).map(t => t.length > 24 ? t.slice(0,24) : t))];

  const NEW_DAYS = 30;
  // Single-typeface entries (kind: Typeface) show only as fonts. Their font is listed even without a
  // screenshot (blocked sites), as a name tile, so moving them off the Foundries list never hides them.
  const isTypeface = it => !!it && it.kind === "Typeface";
  const tfIds = () => new Set(items.filter(isTypeface).map(i => i.id));
  const listedFont = (f, tf) => !!f.shotId || (tf.has(f.foundryId) && f.scan === "failed");
  const foundryLabel = fd => isTypeface(fd) ? (fd.by || "") : (fd.name || "");
  // basic price per weight (set in foundries.yaml)
  const CUR = { USD:"$", EUR:"€", GBP:"£", ILS:"₪", JPY:"¥", NZD:"NZ$", AUD:"A$", CAD:"C$", CHF:"CHF ", SEK:"SEK ", DKK:"DKK ", NOK:"NOK " };
  const fmtPrice = p => !p ? null : p.amount === 0 ? "Free" : (CUR[p.currency] || p.currency + " ") + (Number.isInteger(p.amount) ? p.amount : p.amount.toFixed(2)) + "/weight";
  const isNew = it => Array.isArray(it.newReleases) && it.newReleases.length && it.newSince && (Date.now() - Date.parse(it.newSince)) < NEW_DAYS*864e5;
  const shot = (id, at, full) => id ? "shots/" + id.split("/").map(encodeURIComponent).join("/") + (full ? ".webp" : ".thumb.webp") + (at ? "?v=" + (Date.parse(at) || 0) : "") : null;
  const shotUrl = (it, full) => shot(it.shotId, it.shotAt, full);
  const setImg = (img, it, w) => { img.src = shotUrl(it); img.srcset = shotUrl(it) + " 800w, " + shotUrl(it, true) + " 1600w"; img.sizes = (w || 400) + "px"; };
  // full-screen viewer; ← → (or swipe) step through whatever the current tab shows, in its order
  let lbList = [], lbAt = -1;
  const lbName = it => { if (!it.foundryId) return it.name; const by = foundryLabel(items.find(i => i.id === it.foundryId) || {}); return it.name + (by ? " · " + by : ""); };
  function lightbox(it){
    const lb = $("#lb"); lbAt = lbList.indexOf(it);
    const name = lbName(it);
    lb.querySelector("img").src = shotUrl(it, true); lb.querySelector("img").alt = "Screenshot of " + name;
    $("#lbName").textContent = name; $("#lbLink").href = it.url; lb.hidden = false;
    const slot = $("#lbVote"); slot.replaceChildren();
    if (votesOn) { const vb = voteBtn(it, it.foundryId ? it.id : fkey(it.id)); vb.title = "Like (L)"; vb.setAttribute("aria-keyshortcuts", "L"); slot.append(vb); }
    $("#lbPos").textContent = lbAt >= 0 && lbList.length > 1 ? `${lbAt + 1} / ${lbList.length}` : "";
    $("#lbPrev").hidden = $("#lbNext").hidden = !(lbAt >= 0 && lbList.length > 1);
    const nb = lbList[lbAt + 1]; if (nb) new Image().src = shotUrl(nb, true); // preload the next one
  }
  const lbStep = d => { if (lbAt < 0 || lbList.length < 2) return; lightbox(lbList[(lbAt + d + lbList.length) % lbList.length]); };
  function zoomBtn(it, name){
    const b = el("button","zoom"); b.type = "button"; b.setAttribute("aria-label", "View larger screenshot of " + name);
    b.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>';
    b.onclick = e => { e.preventDefault(); e.stopPropagation(); lightbox(it); };
    return b;
  }
  // font cards: a bar that slides up from the bottom of the thumbnail on hover
  function examineBtn(it, name){
    const b = el("button","examine"); b.type = "button"; b.setAttribute("aria-label", "Examine " + name + " full screen");
    b.innerHTML = '<span>Examine font</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>';
    b.onclick = e => { e.preventDefault(); e.stopPropagation(); lightbox(it); };
    return b;
  }
  /* ---------- filtering ---------- */
  function visible(){
    const q = state.q.toLowerCase().trim();
    let out = items.filter(it => {
      if (isTypeface(it)) return false;
      if (state.kind && it.kind !== state.kind) return false;
      if (state.onlyNew && !isNew(it)) return false;
      for (const t of state.tags) if (!(it.tags||[]).includes(t)) return false;
      if (q) {
        const hay = [it.name, it.by, it.note, host(it.url), it.kind, ...(it.tags||[]), ...(it.typefaces||[])].join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const by = {
      order: (a,b) => (a.order ?? 1e9) - (b.order ?? 1e9),
      az: (a,b) => String(a.name).localeCompare(String(b.name), undefined, {sensitivity:"base"}),
      new: (a,b) => String(b.addedAt||"").localeCompare(String(a.addedAt||"")) || (b.order??0)-(a.order??0),
      votes: (a,b) => foundryVotes(b.id) - foundryVotes(a.id) || (a.order ?? 1e9) - (b.order ?? 1e9)
    }[state.sort];
    return out.sort(by);
  }

  /* ---------- rendering ---------- */
  function renderStats(){
    const s = $("#stats"); s.replaceChildren();
    const count = k => items.filter(i => i.kind === k).length;
    const k = state.kind, list = items.filter(i => i.kind === k);
    (k === "Library" ? [["Libraries", list.length], ["New", list.filter(isNew).length]] : [["Foundries", list.length], ["New", list.filter(isNew).length]])

  });
  function updateFilterCounts(){
    const nF = fstate.foundries.size + (fstate.cat?1:0) + fstate.props.size + (fstate.minStyles>1?1:0) + ((fstate.minPrice!=null||fstate.maxPrice!=null)?1:0) + (moodActive()?1:0) + fstate.langs.size + fstate.tags.size + (fstate.onlyNew?1:0);
    const nD = state.tags.size + (state.onlyNew?1:0);
    const a = document.querySelector('#fontBar .filtersBtn .n'), b = document.querySelector('#foundryBar .filtersBtn .n');
    if (a) a.textContent = nF || ""; if (b) b.textContent = nD || "";
  }
  window.addEventListener("hashchange", () => { readFoundryParam(); fstate.limit = PAGE; render(); window.scrollTo({top:0}); });

  /* ---------- foundry picker: type-ahead with chips, several at once; kept in the URL (#fonts?foundry=a,b) ---------- */
  function readFoundryParam(){
    const m = location.hash.match(/[?&]foundry=([^&]*)/);
    if (m) fstate.foundries = new Set(decodeURIComponent(m[1]).split(",").filter(Boolean));
  }
  function writeFoundryParam(){
    if (tab() !== "fonts") return;
    const ids = [...fstate.foundries], h = "#fonts" + (ids.length ? "?foundry=" + ids.map(encodeURIComponent).join(",") : "");
    if (location.hash !== h && !(h === "#fonts" && !location.hash)) history.replaceState(null, "", h);
  }
  // type-ahead multi-select with chips; used for foundries and languages
  function makePicker({ root, set, noun, nouns, all: allLabel, add: addLabel, favRow: favOpt, onUpdate }){
    const field = root.querySelector(".fpfield"), chips = root.querySelector(".fpchips"), input = root.querySelector(".fpinput"), panel = root.querySelector(".fppanel"), list = root.querySelector(".fplist"), head = root.querySelector(".fphead");
    const oid = root.id + "-o";
    let all = [], shown = [], rows = [], act = -1, note = "";
    const sel = () => set();
    const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    const isOpen = () => !panel.hidden;
    function open(){ if (isOpen()) return; panel.hidden = false; root.classList.add("open"); input.setAttribute("aria-expanded", "true"); draw(); }
    function close(){ panel.hidden = true; root.classList.remove("open"); input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-activedescendant"); act = -1; }
    function changed(){ fstate.limit = PAGE; render(); }
    function toggle(id){ sel().has(id) ? sel().delete(id) : sel().add(id); input.value = ""; changed(); input.focus(); }
    function toggleGroup(ids){
      if (!ids.length) return;
      const allOn = ids.every(id => sel().has(id));
      ids.forEach(id => allOn ? sel().delete(id) : sel().add(id));
      input.value = ""; changed(); input.focus();
    }
    function draw(){
      const q = norm(input.value.trim());
      shown = q ? all.filter(o => norm(o.name).includes(q)).sort((a,b) => (norm(b.name).startsWith(q) - norm(a.name).startsWith(q)) || a.name.localeCompare(b.name)) : all;
      const fav = favOpt && (!q || favOpt.match.includes(q)) ? favOpt : null, favIds = fav ? fav.ids(all) : [];
      rows = (fav ? [{ fav: true }] : []).concat(shown);
      head.textContent = q ? `${shown.length} ${shown.length === 1 ? "match" : "matches"} for “${input.value.trim()}”` : `${all.length} ${all.length === 1 ? noun : nouns}` + (sel().size ? ` · ${sel().size} picked` : "") + (note ? " · " + note : "");
      if (act >= rows.length) act = rows.length - 1; if (q && act < 0 && shown.length) act = rows.indexOf(shown[0]);
      list.replaceChildren(...rows.map((o, i) => {
        if (o.fav) {
          const li = el("li", "fav" + (favIds.length ? "" : " off")); li.id = oid + i; li.setAttribute("role", "option");
          const on = favIds.length > 0 && favIds.every(id => sel().has(id));
          li.setAttribute("aria-selected", on); if (!favIds.length) li.setAttribute("aria-disabled", "true");
          if (i === act) li.classList.add("act");
          li.append(el("span", "bx"), el("span", "nm", favIds.length ? fav.label : fav.empty), el("span", "ct", favIds.length ? String(favIds.length) : ""));
          li.onmousedown = e => e.preventDefault();
          li.onclick = () => { act = i; toggleGroup(fav.ids(all)); };
          return li;
        }
        const li = el("li"); li.id = oid + i; li.setAttribute("role", "option"); li.setAttribute("aria-selected", sel().has(o.id));
        if (o.title) li.title = o.title;
        if (i === act) li.classList.add("act");
        const nm = el("span", "nm"); const k = q ? norm(o.name).indexOf(q) : -1;
        if (k >= 0) nm.append(o.name.slice(0, k), el("b", null, o.name.slice(k, k + q.length)), o.name.slice(k + q.length)); else nm.textContent = o.name;
        li.append(el("span", "bx"), nm, el("span", "ct", String(o.n)));
        li.onmousedown = e => e.preventDefault(); // keep focus in the input
        li.onclick = () => { act = i; toggle(o.id); };
        return li;
      }));
      if (!shown.length) list.append(el("li", "none", `No ${noun} matches`));
      if (act >= 0 && rows.length) { input.setAttribute("aria-activedescendant", oid + act); list.children[act]?.scrollIntoView({ block: "nearest" }); } else input.removeAttribute("aria-activedescendant");
    }
    function update(opts, n){
      all = opts; note = n || ""; const byKey = new Map(opts.map(o => [o.id, o]));
      chips.replaceChildren(...[...sel()].filter(id => byKey.has(id)).map(id => {
        const b = el("button", "fpchip"); b.type = "button"; b.setAttribute("aria-label", "Remove " + byKey.get(id).name);
        b.append(el("span", null, byKey.get(id).name), el("b", null, "×"));
        b.onclick = e => { e.stopPropagation(); sel().delete(id); changed(); input.focus(); };
        return b;
      }));
      root.classList.toggle("has", sel().size > 0);
      input.placeholder = sel().size ? addLabel : allLabel;
      if (onUpdate) onUpdate();
      if (isOpen()) draw();
    }
    field.addEventListener("click", e => { if (e.target.closest(".fpchip")) return; input.focus(); isOpen() ? (input.value ? null : close()) : open(); });
    input.addEventListener("input", () => { act = -1; open(); draw(); });
    input.addEventListener("keydown", e => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!isOpen()) { open(); return; } const n = rows.length; if (!n) return; act = e.key === "ArrowDown" ? (act + 1) % n : (act <= 0 ? n - 1 : act - 1); draw(); }
      else if (e.key === "Enter") { if (isOpen() && act >= 0 && rows[act]) { e.preventDefault(); rows[act].fav ? toggleGroup(favOpt.ids(all)) : toggle(rows[act].id); } }
      else if (e.key === "Escape") { if (input.value) { input.value = ""; act = -1; draw(); } else if (isOpen()) close(); else return; e.preventDefault(); e.stopPropagation(); }
      else if (e.key === "Backspace" && !input.value && sel().size) { const last = [...sel()].pop(); sel().delete(last); changed(); }
      else if (e.key === "Tab") close();
    });
    document.addEventListener("pointerdown", e => { if (isOpen() && !root.contains(e.target)) close(); });
    return { update };
  }
  const fpick = makePicker({ root: $("#fPick"), set: () => fstate.foundries, noun: "foundry", nouns: "foundries", all: "All foundries", add: "Add foundry",
    favRow: { match: "liked favourites favorites", label: "All liked foundries", empty: "No liked foundries yet", ids: all => all.filter(o => myVotes.has("foundry:" + o.id)).map(o => o.id) },
    onUpdate: () => writeFoundryParam() }); // also covers picks made from a font card
  const lpick = makePicker({ root: $("#lPick"), set: () => fstate.langs, noun: "language", nouns: "languages", all: "All languages", add: "Add language" });
  readFoundryParam();
  // cards per row (2–5): one setting for every grid; also picks how big an image each card loads
  const COL_CARD = { 2: 560, 3: 400, 4: 300, 5: 240 };
  let cols = 3;
  try { const c = +localStorage.getItem("fdx-cols"); if (COL_CARD[c]) cols = c; } catch(_){}
  function out_card(){
    fstate.card = COL_CARD[cols];
    document.documentElement.style.setProperty("--cols", cols);
    document.documentElement.style.setProperty("--card", fstate.card + "px");
    document.querySelectorAll(".seg.cols button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.cols === cols));
  }
  document.querySelectorAll(".seg.cols button").forEach(b => b.onclick = () => {
    const before = fstate.card; cols = +b.dataset.cols; out_card();
    try { localStorage.setItem("fdx-cols", cols); } catch(_){}
    if (fstate.card > before) render(); // bigger cards: re-render so they pick up sharper images
  });
  out_card(); // apply the saved choice before the first render, whichever tab opens
  const fillSlider = i => i.style.setProperty("--p", ((+i.value - +i.min) / ((+i.max - +i.min) || 1) * 100) + "%");
  for (const id of ["#fStyles"]) { const i = $(id); i.addEventListener("input", () => fillSlider(i)); requestAnimationFrame(() => fillSlider(i)); }
  $("#fStyles").addEventListener("input", e => { fstate.minStyles = +e.target.value; fstate.limit = PAGE; render(); });
  // price range: two thumbs on one track; min at 0 or max at the top means "no limit" on that side
  function priceRange(top, disabled){
    const lo = $("#fPriceMin"), hi = $("#fPriceMax");
    for (const i of [lo, hi]) { i.max = top; i.disabled = disabled; }
    lo.value = fstate.minPrice ?? 0; hi.value = fstate.maxPrice ?? top;
    const a = +lo.value / top * 100, b = +hi.value / top * 100;
    const fill = $("#fPriceFill"); fill.style.left = a + "%"; fill.style.width = Math.max(0, b - a) + "%";
    const L = fstate.minPrice, H = fstate.maxPrice;
    $("#fPriceOut").textContent = L == null && H == null ? "Any" : (!L && H === 0) ? "Free" : L == null ? "≤ $" + H : H == null ? "$" + L + "+" : L === H ? "$" + L : "$" + L + "–" + H;
    $("#fPrice").title = "Basic price for one weight, roughly converted to US$. Fonts without a price are hidden while this is set.";
  }
  const onPrice = which => e => {
    const lo = $("#fPriceMin"), hi = $("#fPriceMax"), top = +hi.max;
    let a = +lo.value, b = +hi.value;
    if (a > b) { if (which === "min") a = b; else b = a; } // thumbs can't cross
    fstate.minPrice = a <= 0 ? null : a; fstate.maxPrice = b >= top ? null : b;
    fstate.limit = PAGE; render();
  };
  $("#fPriceMin").addEventListener("input", onPrice("min"));
  // personality: four opposite pairs, each a 0–100 range (scores from Claude looking at each screenshot)
  const MOODS = [["Calm","Loud"],["Serious","Playful"],["Classic","Futuristic"],["Clean","Rough"]];
  const moodActive = () => fstate.mood.some(([a, b]) => a > 0 || b < 100);
  (() => {
    const row = $("#fMoods");
    MOODS.forEach(([l, r], i) => {
      const w = el("div","slider mood");
      const lo = Object.assign(el("input"), { type:"range", min:0, max:100, step:5, value:0 }); lo.setAttribute("aria-label", `${l} end of ${l}–${r}`);
      const hi = Object.assign(el("input"), { type:"range", min:0, max:100, step:5, value:100 }); hi.setAttribute("aria-label", `${r} end of ${l}–${r}`);
      const rg = el("div","range"); rg.append(el("div","rtrack"), Object.assign(el("div","rfill"), { id:"fMoodFill"+i }), lo, hi);
      lo.id = "fMoodLo"+i; hi.id = "fMoodHi"+i;
      const on = which => () => { let a = +lo.value, b = +hi.value; if (a > b) { if (which === "lo") a = b; else b = a; } fstate.mood[i] = [a, b]; fstate.limit = PAGE; render(); };
      lo.addEventListener("input", on("lo")); hi.addEventListener("input", on("hi"));
      w.append(el("label", "pole", l), rg, el("label", "pole", r)); row.append(w);
    });
  })();
  function moodRanges(){
    fstate.mood.forEach(([a, b], i) => {
      const lo = $("#fMoodLo"+i), hi = $("#fMoodHi"+i); if (!lo) return;
      lo.value = a; hi.value = b;
      const f = $("#fMoodFill"+i); f.style.left = a + "%"; f.style.width = Math.max(0, b - a) + "%";
    });
  }
  $("#fPriceMax").addEventListener("input", onPrice("max"));
  $("#fReset").onclick = () => { Object.assign(fstate, { q:"", foundries:new Set(), cat:null, onlyNew:false, minStyles:1, minPrice:null, maxPrice:null, mood:[[0,100],[0,100],[0,100],[0,100]], langs:new Set(), limit:60 }); fstate.props.clear(); fstate.tags.clear(); $("#fq").value = ""; render(); };
  $("#fq").addEventListener("input", e => { fstate.q = e.target.value; fstate.limit = PAGE; render(); });
  $("#fSort").addEventListener("change", e => { fstate.sort = e.target.value; if (e.target.value === "shuffle") shuffleKey = Math.random(); render(); });
  $("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
  $("#sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
  $("#lb").onclick = e => { if (e.target.closest(".lbnav")) { e.stopPropagation(); lbStep(e.target.closest(".lbnav").id === "lbPrev" ? -1 : 1); return; } if (e.target.tagName !== "A") $("#lb").hidden = true; };
  $("#cmpOpen").onclick = openCompare;
  $("#cmpClose").onclick = closeCompare;
  $("#cmpClear").onclick = $("#cmpClear2").onclick = () => { cmp = []; saveCmp(); syncCmp(); };
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#cmp").hidden) { closeCompare(); return; } });
  document.addEventListener("keydown", e => { if ($("#lb").hidden) return; if (e.key === "Escape") $("#lb").hidden = true; else if ((e.key === "l" || e.key === "L") && !e.metaKey && !e.ctrlKey && !e.altKey) { const v = $("#lbVote .vote"); if (v) { e.preventDefault(); v.click(); } } else if (e.key === "ArrowLeft") { e.preventDefault(); lbStep(-1); } else if (e.key === "ArrowRight") { e.preventDefault(); lbStep(1); } });
  { let x0 = null; $("#lb").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
    $("#lb").addEventListener("touchend", e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) { e.preventDefault(); lbStep(dx < 0 ? 1 : -1); } }); }

  /* ---------- data ---------- */
  render();
  $("#status").textContent = "Loading the index…";
  const clean = arr => (arr||[]).filter(i => safeUrl(i.url)).map(i => ({ ...i, url: safeUrl(i.url), name: String(i.name || nameFromUrl(i.url)), tags: Array.isArray(i.tags) ? i.tags.map(String) : [], typefaces: Array.isArray(i.typefaces) ? i.typefaces.map(String) : [], newReleases: Array.isArray(i.newReleases) ? i.newReleases.map(String) : [] }));
  (async () => {
    try {
      const r = await fetch("data/data.json", { cache: "no-cache" });
      if (!r.ok) throw new Error(r.status);
      const snap = await r.json();
      fonts = (snap.fonts||[]).filter(f => safeUrl(f.url) && f.name).map(f => ({ ...f, url: safeUrl(f.url), name: String(f.name) }));
      items = clean(snap.foundries);
      const d = snap.updatedAt ? new Date(snap.updatedAt) : null;
      $("#status").textContent = $("#status").dataset.base = d ? "Updated " + d.toLocaleDateString(undefined, {day:"numeric", month:"short", year:"numeric"}) : "";
      if (votesOn) { $("#optVotes").hidden = false; $("#optFVotes").hidden = false; }
      render(); loadVotes(); loadTierScores(); syncCmp();
    } catch(e) {
      $("#status").textContent = "The index couldn't load. Reload the page to try again.";
    }
  })();
})();
</script>
</body>
